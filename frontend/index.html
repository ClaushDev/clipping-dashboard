<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipping Studio</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Tema antes de pintar (oscuro por defecto) para que no haya un destello claro al abrir.
      (function () {
        var t = null;
        try { t = localStorage.getItem("cs-theme"); } catch (e) {}
        var light = t === "light" || (t === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='9' y='3' width='14' height='26' rx='3' fill='%23f5c518'/><rect x='12' y='20' width='8' height='3' rx='1' fill='%23111'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
