[project]
name = "clipping-ml"
version = "0.1.0"
description = "Modelos opcionales del editor (SAM 2 para recortar y seguir, Grounding DINO para localizar objetos). Se ejecutan como procesos aparte desde el backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.51",
    "accelerate>=1.6",
    "numpy>=1.26",
    "pillow>=11",
    "imageio-ffmpeg>=0.6",
]

[tool.uv]
package = false
# La herramienta es para Windows: solo versiones con paquetes para Windows de 64 bits
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
